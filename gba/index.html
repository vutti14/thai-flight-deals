<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โซน GBA · กวางโจว เซินเจิ้น ฮ่องกง มาเก๊า | แดชบอร์ดตั๋วเครื่องบิน</title>
<meta name="description" content="ราคาตั๋วบินตรงกรุงเทพฯ – กวางโจว เซินเจิ้น ฮ่องกง มาเก๊า ทุกสายการบิน ชั้นประหยัดและชั้นธุรกิจ ทริป 2 วัน 1 คืน และ 3 วัน 2 คืน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#4b1a7a;--p2:#7a4aa8;--pl:#efe7f7;--a:#e8590c;--al:#fff1e8;--bd:#e4e0ea;--mut:#6b6577;--bg:#f7f5fa;--ink:#221c2b;
 --gold:#8a6100;--goldl:#fbf3dc;--red:#3b3f8f;--redl:#e8e9f8;--r:14px;--sh:0 1px 2px rgba(40,20,70,.06),0 4px 14px rgba(40,20,70,.06);
 --HKG:#c8102e;--CAN:#0f766e;--SZX:#1d4ed8;--MFM:#b45309}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Sarabun','Kanit',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'Kanit','Sarabun',sans-serif;font-weight:600;margin:0}
a{color:var(--p)}
button{font:inherit;color:inherit}
.tabs{display:flex;gap:4px;padding:10px 14px 0;background:var(--p);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:#fff;opacity:.78;text-decoration:none;font:500 14.5px 'Kanit',sans-serif;padding:9px 16px;border-radius:10px 10px 0 0;min-height:42px;display:flex;align-items:center}
.tabs a:hover{opacity:1;background:rgba(255,255,255,.08)}
.tabs a.on{background:var(--bg);color:var(--p);opacity:1}
header{padding:14px 16px 4px;max-width:1320px;margin:0 auto}
header h1{font-size:24px;color:var(--p);line-height:1.25}
header h1 .ac{color:var(--a)}
header .sub{color:var(--mut);font-size:13.5px;margin-top:4px}
.wrap{max-width:1320px;margin:0 auto;padding:8px 14px 0}
.sticky{position:sticky;top:0;z-index:20;background:rgba(247,245,250,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 14px;margin:0 -14px;border-bottom:1px solid transparent}
.sticky.sc{border-bottom-color:var(--bd)}
.bar{display:flex;align-items:center;gap:8px}
.bar .seg{flex:0 1 auto;min-width:0}
.seg{display:inline-flex;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:0 12px;min-height:38px;cursor:pointer;font-size:14px;white-space:nowrap;color:var(--ink)}
.seg button.on{background:var(--p);color:#fff}
.seg button small{opacity:.75;font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:0 14px;min-height:38px;cursor:pointer;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.pill.on{background:var(--p);border-color:var(--p);color:#fff}
.pill .ct{font-size:12px;opacity:.75}
.pill .dot{width:9px;height:9px;border-radius:50%;flex:none}
.frow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;min-height:38px;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:#cfc9d8;position:relative;transition:.2s;cursor:pointer;flex:none;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked{background:var(--a)}.sw input:checked::after{left:19px}
.step{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff}
.step button{width:40px;height:40px;border:0;background:#fff;font-size:20px;color:var(--p);cursor:pointer}
.step input{width:46px;height:40px;border:0;border-left:1px solid var(--bd);border-right:1px solid var(--bd);text-align:center;font:600 16px 'Kanit',sans-serif;color:var(--ink);-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.lbl{font:500 14px 'Kanit',sans-serif;color:var(--p)}
.ftog{display:none}
.note{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--a);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:12px 0}
.note summary{cursor:pointer;font:500 14.5px 'Kanit',sans-serif;color:var(--ink);min-height:28px}
.note ul{margin:6px 0 0 18px;padding:0}.note li{margin:3px 0}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:12px 0 14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);min-width:0;text-align:left;display:block;width:100%}
.card.hero{background:linear-gradient(135deg,#4b1a7a,#7a3aa8);color:#fff;border:0;cursor:pointer}
.card .k{font-size:12.5px;color:var(--mut);font-weight:600;letter-spacing:.2px}
.card.hero .k,.card.hero .d2{color:rgba(255,255,255,.82)}
.card .v{font:600 26px 'Kanit',sans-serif;line-height:1.15;margin-top:2px}
.card .v small{font:400 13px 'Sarabun',sans-serif;opacity:.8}
.card .t{font:600 14px 'Kanit',sans-serif;color:#ffd2b8;margin-top:2px}
.card .d{font-size:13px;margin-top:2px}.card .d2{font-size:12.5px;color:var(--mut);margin-top:3px}
.cc .ch3{display:flex;align-items:center;gap:7px;font:600 16px 'Kanit',sans-serif}
.cc .ch3 i{width:10px;height:10px;border-radius:50%}
.cc .ch3 small{font:400 12px 'Sarabun',sans-serif;color:var(--mut)}
.cg{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px;margin-top:8px;align-items:stretch}
.cg .rh{font:500 12.5px 'Kanit',sans-serif;color:var(--mut);align-self:center;padding-right:2px;white-space:nowrap}
.cg .colh{font-size:11.5px;color:var(--mut);font-weight:600;text-align:left;padding-left:2px}
.cv{border:1px solid var(--bd);border-radius:10px;background:#faf9fc;padding:5px 7px;text-align:left;cursor:pointer;min-height:48px;min-width:0}
.cv:hover{border-color:var(--p2)}
.cv b{display:block;font:600 16px 'Kanit',sans-serif;color:var(--p);line-height:1.2}
.cv.bz b{color:var(--gold)}
.cv span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.na{cursor:default;background:transparent;border-style:dashed}
.cv.na b{color:var(--mut);font-size:13px}
.cc .tip2{font-size:11.5px;color:#7a3e0a;background:var(--al);border-radius:8px;padding:5px 7px;margin-top:7px;line-height:1.35}
section.box{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
section.box>h2,.bh h2{font-size:19px;color:var(--p)}
.bh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.legend{font-size:12.5px;color:var(--mut);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:18px}
.cal h3{font-size:16px;margin:2px 0 6px}
.cal table{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.cal th{font:500 12px 'Kanit',sans-serif;color:var(--mut);padding:2px}
.cal td{background:#faf9fc;border-radius:8px;vertical-align:top;height:44px;padding:4px;font-size:12px}
.cal td.x{background:transparent}
.cal td.has{background:#fff;box-shadow:inset 0 0 0 1px var(--bd);height:76px}
.cal td.hol{box-shadow:inset 0 0 0 2px #f2b8a2}
.cal td.past{opacity:.45}
.cal .n{font-weight:700;font-size:12px;color:var(--mut)}
.cal td.we .n{color:#b03a6b}
.cal .hl{display:block;font-size:10px;color:#c2410c;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{display:flex;align-items:center;gap:3px;width:100%;border:0;text-align:left;background:var(--pl);border-radius:6px;padding:2px 4px;margin-top:3px;line-height:1.2;font-size:11.5px;cursor:pointer;color:var(--ink);min-width:0}
.ch i{width:6px;height:6px;border-radius:50%;flex:none}
.ch .cty{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ch b{margin-left:auto;font-weight:700;white-space:nowrap}
.ch.best{background:#ffd8bf}
.ch.bz{background:var(--goldl)}.ch.bz.best{background:#f6dc8f}
.ch:hover{outline:1px solid var(--p2)}
.list{display:flex;flex-direction:column;gap:10px}
.mh{font:600 15px 'Kanit',sans-serif;color:var(--mut);margin:8px 2px -2px}
.trip{border:1px solid var(--bd);border-left:4px solid var(--cc,var(--p));border-radius:var(--r);padding:12px;background:#fff;scroll-margin-top:170px}
.trip.flash{animation:fl 2.2s ease}
@keyframes fl{0%,40%{background:#fff0d6}100%{background:#fff}}
.th{display:flex;align-items:flex-start;gap:10px 14px;flex-wrap:wrap}
.th .city{flex:1 1 240px;min-width:0}
.th .city b{font:600 18px 'Kanit',sans-serif}
.th .city .cy{color:var(--mut);font-size:13px;margin-left:4px}
.th .dt{font-size:14px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.prs{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 1 330px;min-width:0}
.pb{border-radius:12px;padding:7px 10px;background:var(--pl);min-width:0}
.pb.bz{background:var(--goldl)}
.pb .pk{font-size:11.5px;font-weight:700;color:var(--p);letter-spacing:.2px}
.pb.bz .pk{color:var(--gold)}
.pb .pp{font:600 22px 'Kanit',sans-serif;color:var(--p);line-height:1.15;white-space:nowrap}
.pb.bz .pp{color:var(--gold)}
.pb .pp small{font:400 12px 'Sarabun',sans-serif;color:var(--mut)}
.pb .ps{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb .ps2{font-size:11.5px;color:var(--mut)}
.pb.na .pp{font-size:13px;color:var(--mut);font-family:'Sarabun',sans-serif;font-weight:600;white-space:normal;line-height:1.3;margin-top:2px}
.sum{margin-top:8px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.xp{border:0;background:none;color:var(--p);cursor:pointer;font-size:13.5px;padding:6px 0;min-height:40px;font-weight:600}
.det{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.det h4{margin:0 0 4px;font:600 13.5px 'Kanit',sans-serif;color:var(--p)}
.det .bzc h4{color:var(--gold)}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--bd)}
.op:last-child{border-bottom:0}
.op .who{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.op .tm{grid-column:1/-1;font-size:13px;color:var(--ink);display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center}
.op .p{text-align:right;font-weight:700;white-space:nowrap;font-size:15px}
.op .p.u{font-weight:400;font-size:12px;color:var(--mut)}
.op.x .p{text-decoration:line-through;color:var(--mut)}
.op.top{background:linear-gradient(90deg,rgba(239,231,247,.6),transparent)}
.rt{font-size:12px;color:var(--mut);margin:4px 0 0}
.b{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;line-height:1.5}
.al{background:#f1eef6;color:#3d3450}
.al.lcc{background:#fde8e8;color:#a1161b}
.al.TG{background:#efe7f7;color:#4b1a7a}.al.CX{background:#e3f1ee;color:#005d4b}.al.NX{background:#e6eefb;color:#1d3f8f}.al.CZ{background:#e5f0fb;color:#0b4f8a}.al.ZH{background:#fbe9e9;color:#9b1c1c}
.ap-DMK{background:#fef3c7;color:#92400e;border:1px solid #f5d98a}
.ap-BKK{background:#e0e7ff;color:#3730a3;border:1px solid #c3cdfb}
.fl{font-size:11.5px;color:var(--mut);font-weight:600}
.redeye{background:var(--redl);color:var(--red)}
.hol{background:#fff1e8;color:#b0410a}
.hol.cny{background:#fde2e2;color:#a3161b}
.ty{background:var(--p);color:#fff}
.ty.t3{background:#fff;color:var(--p);border:1px solid var(--p2)}
.cs{font-size:11px;color:var(--mut)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
a.open{display:inline-flex;align-items:center;gap:6px;background:var(--p);color:#fff;text-decoration:none;padding:0 14px;min-height:40px;border-radius:10px;font-size:13.5px;white-space:nowrap}
a.open.bz{background:#fff;color:var(--gold);border:1px solid #e8d49c}
a.open.sec{background:#fff;color:var(--p);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:12.5px}
.empty{color:var(--mut);padding:16px;text-align:center}
.sznote{margin-top:8px;font-size:12.5px;background:var(--al);color:#7a3e0a;border-radius:10px;padding:7px 10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--bd);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{font:500 12.5px 'Kanit',sans-serif;color:var(--p);background:var(--pl)}
.tblw{overflow-x:auto}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 10px}
.fit>div{border:1px solid var(--bd);border-radius:12px;padding:8px 10px;font-size:13px;min-width:0}
.fit h4{margin:0 0 4px;font:600 13.5px 'Kanit',sans-serif;color:var(--p)}
.fit ul{margin:0;padding-left:18px}.fit li{margin:2px 0}
.ok{color:#137a43;font-weight:700}
.fr{white-space:nowrap;font-size:12.5px;line-height:1.6}.fr.su{color:var(--mut);font-size:11.5px}
.rtb td:first-child{width:34%}
.news{font-size:12.5px;color:var(--mut);margin:8px 0 0 18px;padding:0}
.news li{margin:3px 0;overflow-wrap:anywhere}
footer{color:var(--mut);font-size:12.5px;padding:6px 4px 40px}
@media(max-width:1180px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card.hero{grid-column:1/-1}}
@media(max-width:640px){
 header h1{font-size:20px}
 .tabs{padding:8px 8px 0;gap:2px}
 .tabs a{padding:8px 10px;font-size:13.5px}
 .ftog{display:inline-flex;margin-left:auto;padding:0 12px}
 .seg button small{display:none}
 #cty{margin-top:6px!important}
 .sticky{padding-top:6px;padding-bottom:6px}
 .sticky .frow{display:none}.sticky.open .frow{display:flex}
 .seg button{padding:0 10px;font-size:13.5px}
 .cards{grid-template-columns:minmax(0,1fr);gap:8px}
 .card{padding:10px 11px}
 .card .v{font-size:22px}
 .cal table{border-spacing:2px}
 .cal td{height:34px;padding:2px;font-size:10.5px;border-radius:6px}
 .cal td.has{height:64px}
 .ch{font-size:9.5px;padding:1px 2px;gap:2px}
 .ch .cty{display:none}
 .ch i{width:7px;height:7px}
 .cal .hl{font-size:8.5px}
 .prs{flex:1 1 100%}
 .det{grid-template-columns:minmax(0,1fr)}
 .fit{grid-template-columns:minmax(0,1fr)}
 .rtb thead{display:none}
 .rtb tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--bd);padding:6px 0}
 .rtb td{border:0;padding:3px 4px;min-width:0}
 .rtb td:first-child{grid-column:1/-1;width:auto;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
 .rtb td:first-child .mut{margin:0!important}
 .rtb td:nth-child(2)::before{content:"ขาไป";display:block;font:500 11.5px 'Kanit',sans-serif;color:var(--p)}
 .rtb td:nth-child(3)::before{content:"ขากลับ";display:block;font:500 11.5px 'Kanit',sans-serif;color:var(--p)}
 .fr{font-size:12px}
 section.box{padding:12px}
}
</style></head>
<body>
<nav class="tabs" aria-label="เลือกแดชบอร์ด"><a href="../">การบินไทย</a><a href="../budget/">สายการบินราคาประหยัด</a><a class="on" href="./" aria-current="page">โซน GBA</a></nav>
<header><h1>โซน <span class="ac">GBA</span> · กวางโจว เซินเจิ้น ฮ่องกง มาเก๊า</h1>
<div class="sub" id="hsub"></div></header>
<div class="wrap">
 <div class="sticky" id="stk">
  <div class="bar"><div class="seg" id="typ"></div><button class="pill ftog" id="ftog" aria-expanded="false">ตัวกรอง</button></div>
  <div class="chips" id="cty" style="margin-top:8px"></div>
  <div class="frow"><div class="seg" id="mon"></div>
   <label class="sw" title="ซ่อนเที่ยวบินขาไปที่ออก 23:00–04:59"><input type="checkbox" id="noout"> ไม่เอาขาไป 5 ทุ่ม–ตี 5</label>
   <label class="sw" title="ซ่อนขากลับที่ออก 01:00–12:59 (มาเก๊า 2 วัน 1 คืนใช้เวลาตั๋วจริง ทริป 3 วัน 2 คืนใช้ตารางบินของสายนั้น)"><input type="checkbox" id="noback"> ไม่เอาขากลับ ตี 1–บ่ายโมง</label>
   <span class="lbl">ไปกี่คน</span><div class="step"><button id="nm" aria-label="ลดจำนวนคน">−</button><input id="n" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="จำนวนคน"><button id="np" aria-label="เพิ่มจำนวนคน">+</button></div></div>
 </div>
 <details class="note" id="cov"><summary>ข้อมูลครอบคลุมแค่ไหน · ข้อจำกัดที่ควรรู้</summary><div id="covb"></div></details>
 <div class="cards" id="cards"></div>
 <section class="box"><div class="bh"><h2>ปฏิทินวันบินไป</h2><div class="seg" id="calcab"></div></div>
  <div class="legend" id="cleg"></div>
  <div class="months" id="cal"></div></section>
 <section class="box"><h2>ทริปทั้งหมด เรียงตามวันบินไป</h2><div class="legend" id="lleg"></div><div class="list" id="list"></div></section>
 <section class="box" id="routes"><div class="bh"><h2>ตารางบินแต่ละเมือง</h2><div class="chips" id="rcty"></div></div><div id="rbody"></div></section>
 <footer id="foot"></footer>

document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
 const x=e.target.closest("[data-x]");if(x){openDet(x.dataset.x);return}
 const c=e.target.closest("[data-c]");if(c){st.c=c.dataset.c;render();return}
 const rc=e.target.closest("[data-rc]");if(rc){st.rc=rc.dataset.rc;renderRoutes();return}});
$("nm").onclick=()=>{st.n=Math.max(1,st.n-1);render()};$("np").onclick=()=>{st.n=Math.min(99,st.n+1);render()};
$("n").onchange=e=>{st.n=Math.max(1,Math.min(99,Math.round(+e.target.value)||1));render()};
$("noout").onchange=e=>{st.noout=e.target.checked;render()};$("noback").onchange=e=>{st.noback=e.target.checked;render()};
$("ftog").onclick=()=>{const s=$("stk");s.classList.toggle("open");$("ftog").setAttribute("aria-expanded",s.classList.contains("open"))};
addEventListener("scroll",()=>$("stk").classList.toggle("sc",scrollY>120),{passive:true});
readHash();if(st.c!=="all")st.rc=st.c;renderStatic();render();
</script>
