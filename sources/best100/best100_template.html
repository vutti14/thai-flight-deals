<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip.Best 100 · โรงแรมและที่เที่ยวติดอันดับ ที่บินตรงจากไทย | แดชบอร์ดตั๋วเครื่องบิน</title>
<meta name="description" content="โรงแรมและที่เที่ยวจากลิสต์ Trip.com Trip.Best Global 100 / Asia 100 และ Top ของแต่ละเมือง คัดเฉพาะเมืองที่มีเที่ยวบินตรงจากกรุงเทพฯ เริ่มจากจีนและโซน GBA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#4b1a7a;--p2:#7a4aa8;--pl:#efe7f7;--a:#e8590c;--al:#fff1e8;--bd:#e4e0ea;--mut:#6b6577;--bg:#f7f5fa;--ink:#221c2b;
 --gold:#8a6100;--goldl:#fbf3dc;--grn:#137a43;--grnl:#e5f5ec;--r:14px;--sh:0 1px 2px rgba(40,20,70,.06),0 4px 14px rgba(40,20,70,.06)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:150px}
body{margin:0;font-family:'Sarabun','Kanit',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'Kanit','Sarabun',sans-serif;font-weight:600;margin:0}
a{color:var(--p)}
button,input{font:inherit;color:inherit}
.tabs{display:flex;gap:4px;padding:10px 14px 0;background:var(--p);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:#fff;opacity:.78;text-decoration:none;font:500 14.5px 'Kanit',sans-serif;padding:9px 16px;border-radius:10px 10px 0 0;min-height:42px;display:flex;align-items:center}
.tabs a:hover{opacity:1;background:rgba(255,255,255,.08)}
.tabs a.on{background:var(--bg);color:var(--p);opacity:1}
header{padding:14px 16px 4px;max-width:1320px;margin:0 auto}
header h1{font-size:24px;color:var(--p);line-height:1.25}
header h1 .ac{color:var(--a)}
header .sub{color:var(--mut);font-size:13.5px;margin-top:4px}
.wrap{max-width:1320px;margin:0 auto;padding:8px 14px 0}
.sticky{position:sticky;top:0;z-index:20;background:rgba(247,245,250,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 14px;margin:0 -14px;border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:0 12px;min-height:36px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--p);color:#fff}
.q{flex:1 1 200px;min-width:0;max-width:340px;border:1px solid var(--bd);border-radius:12px;padding:0 12px;min-height:42px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.chip b{color:var(--p)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
.stat .v{font:600 24px 'Kanit',sans-serif;color:var(--p)}
.stat .l{font-size:12.5px;color:var(--mut)}
details.note{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:8px 12px;margin:0 0 12px;font-size:13.5px}
details.note summary{cursor:pointer;font-weight:600;color:var(--p)}
details.note ul{margin:6px 0 2px 18px;padding:0}details.note li{margin:3px 0}
.grp{margin:18px 0 8px;font-size:19px;color:var(--p);display:flex;align-items:center;gap:8px}
.grp small{font:400 13px 'Sarabun',sans-serif;color:var(--mut)}
.dests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dest{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:14px;min-width:0}
.dest.gba{border-top:4px solid var(--a)}
.dh{display:flex;align-items:flex-start;gap:10px}
.dh .fl{font-size:28px;line-height:1}
.dh h3{font-size:20px;line-height:1.2}
.dh h3 small{font:400 13.5px 'Sarabun',sans-serif;color:var(--mut);margin-left:4px}
.cnt{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--pl);color:var(--p);white-space:nowrap}
.pill.o{background:var(--al);color:var(--a)}
.why{margin:8px 0 6px;font-size:14px}
.fly{background:var(--grnl);border-radius:10px;padding:7px 10px;font-size:13px;margin:6px 0 4px}
.fly b{color:var(--grn)}
.fly .al{display:inline-block;margin:2px 6px 0 0;white-space:nowrap}
.fly .ap{font-size:11px;background:#fff;border-radius:6px;padding:0 5px;margin-left:3px;color:var(--grn);border:1px solid #bfe3cd}
.biz{background:#eef4fb;border-radius:10px;padding:7px 10px;font-size:13px;margin:6px 0 4px}.biz b{color:#1d4f8a}.biz ul{margin:4px 0 0 0;padding:0;list-style:none}.biz li{margin:3px 0}.biz .lc{color:var(--mut);font-size:11.5px}
.fly.nd{background:#fdf0ef}.fly.nd b{color:#b42318}.rt1{display:block;margin:2px 0}
.dnote{font-size:12.5px;color:var(--gold);background:var(--goldl);border-radius:8px;padding:4px 8px;margin:4px 0}
.sec h4{margin:12px 0 4px;font:600 14.5px 'Kanit',sans-serif;color:var(--p)}
.it{list-style:none;margin:0;padding:0}
.it li{padding:6px 0;border-bottom:1px dashed var(--bd);display:flex;gap:8px;align-items:flex-start}
.it li:last-child{border-bottom:0}
.it .nm{font-weight:600;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
.it .nm:hover{color:var(--p);text-decoration:underline}
.it .rt{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;padding-top:2px}
.bd{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.bd a{font-size:11.5px;text-decoration:none;border-radius:6px;padding:1px 6px;background:var(--goldl);color:var(--gold);white-space:nowrap}
.bd a.c{background:var(--pl);color:var(--p)}
.nr{font-size:11.5px;color:var(--a)}
.more{border:0;background:none;color:var(--p);cursor:pointer;padding:6px 0;font-weight:600;font-size:13.5px}
.lk{margin-top:10px;font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 10px}
.lk a{white-space:nowrap}
.empty{color:var(--mut);padding:30px;text-align:center}
footer{color:var(--mut);font-size:12.5px;padding:18px 4px 40px}
@media(max-width:900px){.dests{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
 header h1{font-size:20px}
 .tabs{padding:8px 8px 0;gap:2px}
 .tabs a{padding:8px 10px;font-size:13.5px}
 .seg button{padding:0 9px;font-size:13.5px}
 .q{max-width:none;flex-basis:100%}
 .dest{padding:12px}
 .stat .v{font-size:20px}
 html{scroll-padding-top:20px}
 .sticky{position:relative}
}
</style></head>
<body>
<nav class="tabs" aria-label="เลือกแดชบอร์ด"><a href="../">การบินไทย</a><a href="../budget/">สายการบินราคาประหยัด</a><a href="../gba/">โซน GBA</a><a class="on" href="./" aria-current="page">Trip.Best 100</a></nav>
<header><h1><span class="ac">Trip.Best 100</span> · โรงแรมและที่เที่ยวติดอันดับ ที่บินตรงจากไทย</h1>
<div class="sub" id="hsub"></div></header>
<div class="wrap">
 <div class="sticky">
  <div class="bar"><div class="seg" id="grp"></div><div class="seg" id="typ"></div><input class="q" id="q" type="search" placeholder="ค้นหาเมือง โรงแรม ที่เที่ยว…" aria-label="ค้นหา"></div>
  <div class="chips" id="idx"></div>
 </div>
 <div class="stats" id="stats"></div>
 <details class="note"><summary>ข้อมูลมาจากไหน · ข้อจำกัดที่ควรรู้</summary><div id="covb"></div></details>
 <div id="list"></div>
 <footer id="foot"></footer>
</div>
<script>
const DATA=/*__DATA__*/null;
const G=[["all","ทั้งหมด"],["gba","โซน GBA"],["china","จีน · ไต้หวัน"],["asia","เอเชีย"],["india","อินเดีย"],["me","ตะวันออกกลาง"],["europe","ยุโรป"],["oceania","ออสเตรเลีย · แอฟริกา"]];
const GN={gba:"🇭🇰 โซน GBA",china:"🇨🇳 จีนแผ่นดินใหญ่ · ไต้หวัน",hainan:"🏝 จีน · มณฑลไห่หนาน (ไห่โข่ว · ซานย่า)",shandong:"🍺 จีน · มณฑลซานตง (ชิงเต่า)",india:"🇮🇳 อินเดีย · เมืองที่การบินไทยบินตรง",asia:"🌏 เอเชีย",me:"🕌 ตะวันออกกลาง",europe:"🇪🇺 ยุโรป",oceania:"🦘 ออสเตรเลีย · แอฟริกา",africa:"🦘 ออสเตรเลีย · แอฟริกา"};
const T=[["all","ทั้งหมด"],["h","🏨 โรงแรม"],["a","📍 ที่เที่ยว"]];
const TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thd=s=>{const [y,m,d]=s.split("-").map(Number);return `${d} ${TH_M[m-1]} ${y+543}`};
const esc=s=>String(s??"").replace(/[\x26<>"]/g,c=>({"\x26":"\x26amp;","<":"\x26lt;",">":"\x26gt;",'"':"\x26quot;"}[c]));
const grpOf=d=>d.g==="africa"?"oceania":(d.g==="hainan"||d.g==="shandong")?"china":d.g;   // filter group
const headOf=d=>d.g==="africa"?"oceania":d.g;   // heading group (Hainan / Shandong get their own heading inside China)
const st={g:"all",t:"all",q:"",open:{}};
function readHash(){const h=new URLSearchParams(location.hash.slice(1));if(h.get("g"))st.g=h.get("g");if(h.get("t"))st.t=h.get("t");if(h.get("q"))st.q=h.get("q")}
function writeHash(){const h=new URLSearchParams();if(st.g!=="all")h.set("g",st.g);if(st.t!=="all")h.set("t",st.t);if(st.q)h.set("q",st.q);history.replaceState(null,"",h.toString()?"#"+h:location.pathname)}
function seg(el,opts,key){el.innerHTML=opts.map(([k,l])=>`<button data-k="${k}" class="${st[key]===k?"on":""}">${l}</button>`).join("");
 el.onclick=e=>{const b=e.target.closest("button");if(!b)return;st[key]=b.dataset.k;seg(el,opts,key);render()}}
const dur=m=>m==null?"":`${Math.floor(m/60)} ชม.${m%60?` ${m%60} นาที`:""}`;
function item(v){
 const bd=v.b.map(([l,u,p])=>`<a class="${l.startsWith("Top ")?"c":""}" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} #${p}</a>`).join("");
 const rt=v.r?`<span class="rt">★ ${esc(v.r)}${+v.r>5?"/10":"/5"}</span>`:"";
 return `<li><div style="min-width:0"><a class="nm" href="${esc(v.u)}" target="_blank" rel="noopener">${esc(v.n)}</a>${v.near?` <span class="nr">· ${esc(v.near)}</span>`:""}<div class="bd">${bd}</div></div>${rt}</li>`}
function match(v,q){return !q||v.n.toLowerCase().includes(q)}
function sec(d,kind,arr,q,showAll){
 if(!arr.length)return "";
 const lim=6, list=showAll||q?arr:arr.slice(0,lim);
 return `<div class="sec"><h4>${kind==="h"?"🏨 โรงแรมติดอันดับ":"📍 ที่เที่ยวติดอันดับ"} <small class="pill">${arr.length}</small></h4><ul class="it">${list.map(item).join("")}</ul>${!q&&arr.length>lim?`<button class="more" data-c="${d.code}">${showAll?"ย่อ":"ดูทั้งหมด "+arr.length+" รายการ"}</button>`:""}</div>`}
function card(d){
 const q=st.q.toLowerCase().trim();
 const cityHit=!q||(d.th+" "+d.en+" "+d.code).toLowerCase().includes(q);
 let h=d.h.filter(v=>cityHit||match(v,q)),a=d.a.filter(v=>cityHit||match(v,q));
 if(st.t==="h")a=[];if(st.t==="a")h=[];
 if(!h.length&&!a.length)return "";
 const qq=cityHit?"":q, open=!!st.open[d.code];
 const al=d.fl.airlines.map(([n,ap])=>`<span class="al">${esc(n)}${ap.map(x=>`<span class="ap">${x}</span>`).join("")}</span>`).join("");
 return `<article class="dest ${d.g}" id="d-${d.code}"><div class="dh"><span class="fl">${d.flag}</span><div><h3>${esc(d.th)}<small>${esc(d.en)} · ${esc(d.ap)}</small></h3></div>
 <div class="cnt">${d.h.length?`<span class="pill">🏨 ${d.h.length}</span>`:""}${d.a.length?`<span class="pill o">📍 ${d.a.length}</span>`:""}</div></div>
 <div class="why">${esc(d.why)}</div>
 ${d.fl.airlines.length?`<div class="fly">✈️ <b>บินตรงจากกรุงเทพฯ</b>${d.fl.dur?` · เร็วสุด ${dur(d.fl.dur)}`:""}${d.fl.perday?` · ${d.fl.perday} เที่ยว/วัน (วันตัวอย่าง)`:""}<br>${al}${d.fl.tg?`<span class="rt1">🟣 ${esc(d.fl.tg)}</span>`:""}</div>`
  :`<div class="fly nd">✈️ <b>ยังไม่มีบินตรง</b> · ต่อเครื่อง 1 ครั้ง (BKK/DMK · Google Flights ${d.fl.ndates||""} วันตัวอย่าง)${(d.fl.routes||[]).map(r=>`<span class="rt1">• ${esc(r.al)} — ต่อที่ ${esc(r.via)} · เร็วสุด ${dur(r.dur)}${r.lay?` (รอต่อ ${dur(r.lay)})`:""}${r.price?` · เริ่ม ฿${r.price.toLocaleString("en-US")}`:""}</span>`).join("")}</div>`}
 ${d.biz&&d.biz.length?`<div class="biz">💼 <b>สำหรับไปทำงาน</b> · โรงแรมในลิสต์ Trip.Best ที่ Trip.com ระบุว่าอยู่ใกล้จุดธุรกิจ<ul>${d.biz.map(([n,u,l,lc])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a> — ${esc(l)}<br><span class="lc">${esc(lc)}</span></li>`).join("")}</ul></div>`:""}
 ${d.note?`<div class="dnote">${esc(d.note)}</div>`:""}
 ${sec(d,"h",h,qq,open)}${sec(d,"a",a,qq,open)}
 <div class="lk">${d.links.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">Trip.Best ${esc(l)} ↗</a>`).join("")}${d.rel.map(([l,u])=>`<a href="${u}">${esc(l)} →</a>`).join("")}</div></article>`}
function render(){
 writeHash();
 const ds=DATA.dest.filter(d=>st.g==="all"||grpOf(d)===st.g);
 let html="",cur=null,buf="";
 const flush=()=>{if(buf)html+=`<h2 class="grp">${GN[cur]}</h2><div class="dests">${buf}</div>`;buf=""};
 for(const d of ds){const g=headOf(d);if(g!==cur){flush();cur=g}buf+=card(d)}
 flush();
 document.getElementById("list").innerHTML=html||`<div class="empty">ไม่พบรายการที่ตรงกับคำค้น</div>`;
 document.getElementById("idx").innerHTML=ds.map(d=>`<a class="chip" href="#d-${d.code}" data-j="${d.code}">${d.flag} ${esc(d.th)} <b>${d.h.length+d.a.length}</b></a>`).join("");
}
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".more");if(!b)return;st.open[b.dataset.c]=!st.open[b.dataset.c];render();document.getElementById("d-"+b.dataset.c).scrollIntoView({block:"start"})});
document.getElementById("idx").addEventListener("click",e=>{const a=e.target.closest("a[data-j]");if(!a)return;e.preventDefault();const el=document.getElementById("d-"+a.dataset.j);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})});
const qi=document.getElementById("q");let tm;qi.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=qi.value;render()},200)});
readHash();qi.value=st.q;
const M=DATA.meta;
document.getElementById("hsub").textContent=`จากลิสต์ Trip.com Trip.Best 2027 (Global 100 · Asia 100) และ Top ของแต่ละเมือง · คัดเฉพาะเมืองที่มีเที่ยวบินตรงจาก BKK/DMK · อัปเดต ${thd(M.captured)}`;
document.getElementById("stats").innerHTML=[[M.ndest,"เมือง"],[M.nh,"โรงแรมติดอันดับ"],[M.na,"ที่เที่ยวติดอันดับ"],[M.lists.length,"ลิสต์ Global/Asia 100 ที่ใช้"]].map(([v,l])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
document.getElementById("covb").innerHTML=`<ul>
<li>อันดับ ชื่อ และลิงก์ทุกรายการมาจากหน้า Trip.Best ของ Trip.com โดยตรง (ดึงเมื่อ ${thd(M.captured)}) กดชื่อเพื่อเปิดหน้าโรงแรม/ที่เที่ยวบน Trip.com ส่วนป้ายสีเหลือง/ม่วงพาไปหน้าลิสต์อันดับนั้น</li>
<li>ลิสต์ระดับโลก/เอเชียที่ใช้: ${M.lists.map(([l,u,n])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a> (${n})`).join(" · ")}</li>
<li>ลิสต์ “Top ในเมือง” (ป้ายสีม่วง) Trip.com อัปเดตรายเดือน เราเก็บแค่ ${8} อันดับแรกที่หน้าเว็บแสดงต่อเมือง เฉพาะเมืองจีน/GBA, สิงคโปร์, โตเกียว และดูไบ</li>
